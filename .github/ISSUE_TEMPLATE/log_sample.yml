name: Log sample / unknown event
description: Share a redacted log excerpt of an event DecoVita does not know yet (filter change, meridian flip, autofocus, ...).
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you! The maintainer has no filter wheel, focuser or a setup for meridian
        flips, so the line formats of these events can only come from users like you.

        > [!WARNING]
        > **Never attach original logs** (`GuideLog_*`, `DebugLog_*`, `Logs_App_*`, `*.glog`)
        > and never paste unredacted lines. They contain your Wi-Fi names and passwords,
        > network and MAC addresses, your location and serial numbers.
        > **Issues are public** and cannot be fully deleted once others have seen them.
        >
        > 1. Run DecoVita on your own computer with redaction switched on (the default).
        > 2. Open its output (`*_decoded.txt`) and copy only the lines around the event,
        >    for example from a few lines before it starts to a few lines after it ends.
        > 3. **Check every line yourself before posting.** These events are new to
        >    DecoVita, so they may contain personal data it does not recognise yet
        >    (names, addresses, coordinates, serial numbers, network names). Replace
        >    anything doubtful with `<REDACTED>`.
        > 4. Replace the date in the timestamps (e.g. with `<date>`) and do not post log
        >    file names: they contain the date and time of your session.
  - type: dropdown
    id: event
    attributes:
      label: Event type
      multiple: true
      options:
        - Filter change (filter wheel)
        - Meridian flip
        - Autofocus
        - Other / not sure
    validations:
      required: true
  - type: dropdown
    id: logtype
    attributes:
      label: Log type of the excerpt
      multiple: true
      options:
        - DebugLog
        - GuideLog
        - Phone app log (Logs_App_*)
        - libtoupcam .glog
        - Not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: DecoVita version
      description: Shown in the window title and in `python decovita.py --help`.
      placeholder: "1.4.0"
    validations:
      required: true
  - type: input
    id: firmware
    attributes:
      label: StellaVita firmware and app version (if known)
      description: "The GuideLog preamble shows a line `Version: ...`."
      placeholder: "2.0.37"
  - type: textarea
    id: setup
    attributes:
      label: Setup
      description: Rough setup only, no serial numbers. Mount, camera, filter wheel, focuser.
      placeholder: "Equatorial mount, ToupTek camera, 5-position filter wheel, electronic focuser"
  - type: textarea
    id: excerpt
    attributes:
      label: Redacted excerpt
      description: The lines around the event from DecoVita's redacted output, checked line by line.
      render: text
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: What happened at that time
      description: For example "filter changed from L to R", "flip at about 23:40", "autofocus run before the first light frame".
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I did not attach original logs, every line I posted comes from DecoVita's redacted output, and I checked each line myself for personal data DecoVita may not know yet.
          required: true
